<svg width="1280" height="512" viewBox="0 0 1280 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="flora">
  <!-- flora lockup, dark ink on a light page. Same geometry as
       src/renderer/assets/logo/flora-lockup.svg; only the two gradient stops and
       the wordmark fill differ. The shipping lockup is drawn for flora's own
       dark UI, where #E8CAFF reads well. Against a white README that same
       lavender all but disappears, so this variant deepens the mark and sets the
       wordmark in near-black violet. Requires Poppins; falls back to any
       geometric sans. -->
  <defs>
    <linearGradient id="floraLockupMarkLight" x1="124" y1="124" x2="412" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9333EA"/>
      <stop offset="1" stop-color="#C77DFF"/>
    </linearGradient>
  </defs>
